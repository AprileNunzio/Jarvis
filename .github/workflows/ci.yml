name: Jarvis CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linters
        run: python -m pip install --upgrade pip pyflakes

      - name: Syntax Validation
        run: python -m py_compile $(find server installer_wizard client_satellite -name "*.py")

      - name: Static Analysis
        run: python -m pyflakes server installer_wizard client_satellite

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: installer_wizard/backend/requirements.txt

      - name: Install Supervisor Dependencies
        run: python -m pip install -r installer_wizard/backend/requirements.txt -r installer_wizard/features/documents/requirements.txt

      - name: Unit and API Tests
        working-directory: ./installer_wizard
        run: python -m unittest discover -s tests -t . -v

  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript Syntax
        run: for f in $(find installer_wizard -name "*.js"); do node --check "$f"; done

      - name: Shell Syntax
        run: for f in $(find scripts installer_wizard -name "*.sh") scripts/os/jarvisctl install.sh; do bash -n "$f"; done

  validate-web-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client_web/package-lock.json

      - name: Install and Build Frontend
        working-directory: ./client_web
        run: |
          npm ci
          npm run build
