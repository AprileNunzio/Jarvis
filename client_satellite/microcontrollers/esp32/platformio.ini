[env:jarvis_satellite_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D WIFI_SSID=\"REPLACE_VIA_SCRIPT\"
    -D WIFI_PASS=\"REPLACE_VIA_SCRIPT\"
    -D JARVIS_SERVER_IP=\"REPLACE_VIA_SCRIPT\"
    -D JARVIS_SERVER_PORT=8443

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.2
    links2004/WebSockets @ ^2.4.1
