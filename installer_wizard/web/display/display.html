<!DOCTYPE html>
<html lang="it" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="stylesheet" href="/static/shared/jarvis.css">
<link rel="stylesheet" href="/static/display/display.css">
<link rel="stylesheet" href="/static/display/google.css">
<link rel="stylesheet" href="/static/display/vision.css">
<link rel="stylesheet" href="/static/display/mindstream.css">
</head>
<body class="holo-grid face">
<canvas id="core"></canvas>
<canvas id="scene"></canvas>

<div class="hud">
  <header>
    <div>
      <div class="brand">J.A.R.V.I.S.<small>ASSISTENTE DIGITALE</small></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="clock"><b id="clock">--:--</b><span id="date"></span></div>
  </header>

  <div class="presence" id="presence"></div>
  <div class="ear off" id="ear"><span class="bars" id="ear-bars"></span><span id="ear-text">Microfono non attivo</span></div>
  <div class="desk" id="desk"></div>
  <div class="caption">
    <div class="you" id="you"></div>
    <div class="say" id="say"><span class="greet" id="greet">Buongiorno.</span></div>
  </div>

  <div class="focus-say" id="focus-say"></div>
  <section class="stage" id="stage">
    <div class="stage-head"><h2 id="stage-title"></h2><p id="stage-sub"></p></div>
    <div class="stage-body" id="stage-body"></div>
  </section>

  <!-- Widget Progetti in Background Fluttuante -->
  <div class="project-widget" id="project-widget" style="display:none; position:absolute; right:20px; top:80px; background:rgba(0,10,20,0.8); border:1px solid var(--cyan); border-radius:12px; padding:12px; width:220px; z-index:100; cursor:pointer; backdrop-filter:blur(8px); transition:all 0.3s;">
    <div style="font-size:12px; color:var(--cyan); margin-bottom:6px; font-weight:bold; display:flex; justify-content:space-between;">
       <span>⚙ Lavorazione...</span>
       <span id="proj-pct">0%</span>
    </div>
    <div style="font-size:11px; color:#aaa; margin-bottom:8px;" id="proj-name">Generazione Sito Web</div>
    <div style="width:100%; height:4px; background:#111; border-radius:2px; overflow:hidden;">
       <div id="proj-bar" style="width:0%; height:100%; background:var(--cyan); transition:width 0.5s;"></div>
    </div>
  </div>

  <div class="brain-ui">
    <div class="back"><button class="pill-btn" id="back-face">← Torna al volto</button></div>
    <div class="panel legend" id="legend"></div>
    <div class="panel inspector" id="inspector"></div>
  </div>

  <div class="dock">
    <button class="ibtn" id="btn-brain" title="Mostra il cervello"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 5 2V4.5A2.5 2.5 0 0 0 9 4zm6 0a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-5 2V4.5A2.5 2.5 0 0 1 15 4z"/></svg></button>
    <button class="ibtn mic off" id="btn-mic" title="Parla (oppure dì «Jarvis»)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <input id="in" placeholder="Scrivi o dì «Jarvis»…" autocomplete="off">
    <button class="ibtn" id="btn-vol" title="Audio e aspetto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
    <button class="ibtn" id="btn-voice" title="Voce attiva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
  </div>
  <div class="dock-note" id="note"></div>
  <div class="panel vol-panel" id="vol-panel">
    <div class="panel-title">Audio</div>
    <div class="vol-row"><div class="top"><span>🔊 Altoparlanti <b class="mono" id="vol-out-v">—</b></span><button class="mute" id="vol-out-m">Muto</button></div>
      <input type="range" id="vol-out" min="0" max="150" step="1"><select id="vol-out-d"></select></div>
    <div class="vol-row"><div class="top"><span>🎙 Microfono <b class="mono" id="vol-in-v">—</b></span><button class="mute" id="vol-in-m">Muto</button></div>
      <input type="range" id="vol-in" min="0" max="150" step="1"><div class="meter"><i id="vol-in-meter"></i></div><select id="vol-in-d"></select></div>
    <div class="faint" style="font-size:11px" id="vol-note">Livelli applicati in tempo reale.</div>
    <div class="panel-title" style="margin-top:18px">Aspetto su questo schermo</div>
    <div class="vol-row"><select id="avatar-pref">
        <option value="">Come nelle impostazioni del sistema</option>
        <option value="auto">Automatico (in base al dispositivo)</option>
        <option value="full">Ologramma 3D con volto</option>
        <option value="light">Nucleo leggero</option>
      </select><div class="why" id="avatar-why"></div></div>
  </div>
</div>

<div class="tooltip" id="tip"></div>
<div class="toast-mem" id="toast-mem"></div>
<div class="mind empty" id="mind" title="Cosa sta pensando Jarvis: tocca per i dettagli">
  <div class="mind-head"><span class="mind-dot"></span><span class="mind-who" id="mind-who"></span><span class="mind-time" id="mind-time"></span></div>
  <div class="mind-model" id="mind-model"></div>
  <div class="mind-line" id="mind-line"></div>
  <div class="mind-more" id="mind-more"></div>
</div>
<div class="banner" id="banner"></div>
<div class="listen-overlay"><div class="wave" id="listen-wave"></div><div class="label" id="listen-label"></div></div>
<div class="welcome" id="welcome"><b id="welcome-name"></b><span id="welcome-sub"></span></div>
<div class="link-lost" id="link"><div class="spinner"></div>Riconnessione al supervisore</div>

<script src="/static/shared/core.js"></script>
<script src="/static/display/perf.js"></script>
<script src="/static/display/avatar.js"></script>
<script src="/static/display/desk.js"></script>
<script src="/static/display/state.js"></script>
<script src="/static/display/stage.js"></script>
<script src="/static/display/stage_google.js"></script>
<script src="/static/display/stage_vision.js"></script>
<script src="/static/display/voice.js"></script>
<script src="/static/display/ear.js"></script>
<script src="/static/display/hands.js"></script>
<script src="/static/display/look.js"></script>
<script src="/static/display/brain.js"></script>
<script src="/static/display/mindstream.js"></script>
<script src="/static/display/audio_panel.js"></script>
<script src="/static/display/enroll.js"></script>
<script src="/static/display/mood.js"></script>
<script src="/static/display/ambient.js"></script>
<script src="/static/display/chat.js"></script>
<script src="/static/shared/sfx.js"></script>
<script src="/static/display/sounds.js"></script>
<script src="/static/display/display.js"></script>
</body>
</html>
